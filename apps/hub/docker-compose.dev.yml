# Forgejo for hub development.
#
# Not the hub itself: the hub runs from source through `pnpm nx serve @gpt/hub`,
# where a change is a rebuild rather than an image. `apps/hub/Dockerfile` is
# what packages the hub, and it is a deployment concern.
#
# Bring this up with `pnpm nx run @gpt/hub:forgejo-up`, which also creates the
# site admin and mints the token the hub needs. Nothing here needs the web
# installer.

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: gitarpro-forgejo-dev
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000

      # Without the lock a fresh volume boots into a setup form, and every
      # answer on it has to be given by hand. This is what makes the whole
      # bring-up scriptable.
      FORGEJO__security__INSTALL_LOCK: "true"

      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/gitea.db

      # Forgejo keeps its own default port inside the container; only the host
      # mapping moves, because 3000 is the hub's.
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://localhost:3001/

      # ROOT_URL is what clone_url is built from, so this is the value that
      # ends up pasted into companion's Set up sync dialog.
      FORGEJO__server__DISABLE_SSH: "true"

      # Accounts arrive through the hub's admin-API calls, never through
      # Forgejo's own signup page.
      FORGEJO__service__DISABLE_REGISTRATION: "true"

    volumes:
      - forgejo-data:/data

    ports:
      - "3001:3000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  forgejo-data:
