[package]
name = "gitarpro-companion"
version = "0.0.1"
description = "Gitarpro — companion app for versioning Guitar Pro files"
authors = ["Benjamin Lesieux"]
edition = "2021"
rust-version = "1.82"

[lib]
# The Tauri mobile targets require a lib; the desktop binary just calls into it.
name = "gitarpro_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs the transparent, frameless panel window
# (app.macOSPrivateApi in tauri.conf.json).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# Native "add a file" picker. Driven from Rust, so the webview needs no
# dialog capability of its own.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Storage: one bare repo per tracked file, and the transport that syncs it.
# `ssh` would drag in libssh2 and stays unbuilt until something asks for it.
#
# `vendored-openssl` is not about which TLS backend git2 uses — on Apple that is
# SecureTransport, and libgit2 is compiled without an OpenSSL line in it. It is
# about `libgit2-sys::openssl_init`, which is gated on `all(unix, https)` and so
# calls `OPENSSL_init_ssl` on macOS too. That one live call is enough to put a
# `/opt/homebrew` load command in the binary, which is not a path a user has and
# not a signature the hardened runtime will map. Vendoring resolves the symbol
# inside the binary and the dependency disappears.
git2 = { version = "0.21", default-features = false, features = [
  "https",
  "vendored-openssl",
] }
# Save detection. Watching is per parent directory (Guitar Pro saves
# atomically, so the inode of the file itself is replaced).
notify = "8"
# `.gp` container rebuild (see normalize.rs). Only deflate is needed to read
# what Guitar Pro writes; we write everything back stored.
zip = { version = "5", default-features = false, features = ["deflate"] }
thiserror = "2"
# Remote tokens (see secrets.rs). `config.json` is plain text, so nothing
# secret may land in it. v3 rather than v4 — v4 wants rustc 1.88.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Reading the score Guitar Pro has in front (see guitar_pro.rs). The
# accessibility calls themselves are declared by hand — five stable C symbols
# out of ApplicationServices, not worth a crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
