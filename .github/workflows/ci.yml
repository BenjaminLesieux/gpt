name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  # This workspace is not connected to Nx Cloud: nx.json still carries an
  # nxCloudId, so every task otherwise ends with a 401 telling us to claim the
  # workspace. Disabling the cloud from the environment keeps CI self-contained
  # without editing nx.json.
  NX_NO_CLOUD: 'true'
  # GitHub Actions sets this already; declaring it is what keeps `nx run-many -t
  # test` from hanging, because the `test` target is a bare `vitest` and vitest
  # only drops out of watch mode when CI is set.
  CI: 'true'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node, otherwise `cache: 'pnpm'` has no
      # store path to resolve.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          # The 22 LTS line, which satisfies both vite 8 (^20.19.0 ||
          # >=22.12.0) and vitest 4 (^20.0.0 || ^22.0.0 || >=24.0.0). Note that
          # the node 23 used for local development is outside vitest's range.
          #
          # Not pinned to 22.12.0 any more: better-sqlite3's prebuilt linux-x64
          # binary segfaults on load there — `new Database(':memory:')` in a
          # bare `node -e` takes the process down with SIGSEGV, no vitest
          # involved — which is what every silent test-worker death was.
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # TEMPORARY — diagnosing why every hub spec that opens a database dies
      # as a silent worker exit on this runner and nowhere else. Remove once
      # the cause is known.
      - name: probe better-sqlite3
        continue-on-error: true
        run: |
          echo "--- node ---"; node -p "[process.version, process.arch, process.platform].join(' ')"
          echo "--- direct ---"
          node -e "const D=require('better-sqlite3');const d=new D(':memory:');d.pragma('journal_mode = WAL');d.exec('create table t(x)');console.log('direct ok')"
          echo "direct exit: $?"
          echo "--- inside a fork ---"
          cat > /tmp/probe.cjs <<'JS'
          const { fork } = require('node:child_process');
          if (process.env.CHILD) {
            const D = require('better-sqlite3');
            const d = new D(':memory:'); d.pragma('journal_mode = WAL'); d.exec('create table t(x)');
            console.log('fork child ok'); process.exit(0);
          }
          fork(__filename, [], { env: { ...process.env, CHILD: '1' } })
            .on('exit', (code, sig) => console.log('fork child exited', code, sig));
          JS
          node /tmp/probe.cjs
          echo "--- one spec, on its own ---"
          pnpm exec vitest run --root apps/hub src/db/client.spec.ts 2>&1 | tail -30
        working-directory: apps/hub

      # Linting is root-only. There is no `lint` target on any project, so
      # `nx run-many -t lint` would be a silent no-op.
      - run: pnpm lint

      - run: pnpm nx run-many -t typecheck

      # `test`, not `test-ci`: the atomized `test-ci` targets refuse to run
      # without Nx Cloud.
      - run: pnpm nx run-many -t test

      - run: pnpm nx run-many -t build
