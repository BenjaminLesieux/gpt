<!DOCTYPE html>
<html>
<head>
<style>
  @font-face { font-family: 'Bauhaus'; src: url('../fonts/BauhausRegular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Bauhaus'; src: url('../fonts/BauhausBoldItalic.ttf') format('truetype'); font-weight: 700; font-style: italic; }
  @font-face { font-family: 'Bauhaus'; src: url('../fonts/BauhausBold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Bauhaus'; src: url('../fonts/BauhausItalic.ttf') format('truetype'); font-weight: 400; font-style: italic; }
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
</style>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg); padding: 20px 24px; font-family: var(--font-sans); }
  .field { margin-bottom: 14px; }
  .field-label { font-size: 11px; font-weight: 500; color: var(--color-fg-2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  input, textarea {
    width: 100%; background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); color: var(--color-fg-1); font-family: var(--font-sans);
    font-size: 13px; padding: 8px 10px; outline: none; transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    display: block;
  }
  input:focus, textarea:focus { border-color: oklch(55% 0.16 22 / 70%); box-shadow: 0 0 0 2px oklch(55% 0.16 22 / 25%); }
  input::placeholder, textarea::placeholder { color: var(--color-fg-3); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.5; font-family: var(--font-sans); }
  .input-row { display: flex; gap: 8px; }
  .input-mono { font-family: var(--font-mono) !important; font-size: 12px !important; }
  .hint { font-size: 11px; color: var(--color-fg-3); margin-top: 4px; }
</style>
</head>
<body>
  <div class="field">
    <div class="field-label">Commit message</div>
    <textarea placeholder="add intro riff"></textarea>
    <div class="hint">Use imperative mood — "add", "fix", "update"</div>
  </div>
  <div class="input-row">
    <div class="field" style="flex:1">
      <div class="field-label">Branch name</div>
      <input class="input-mono" type="text" value="feature/bridge-section">
    </div>
    <div class="field" style="flex:1">
      <div class="field-label">Author</div>
      <input type="text" placeholder="Your Name">
    </div>
  </div>
  <div class="field">
    <div class="field-label">Repository path</div>
    <input class="input-mono" type="text" placeholder="/Users/you/songs/my-album">
  </div>
</body>
</html>
